name: HU14 Backend real
on:
  pull_request:
    branches: [develop, main]
    paths:
      - '.github/workflows/artist-prizes-real.yml'
      - 'app/src/test/java/co/edu/uniandes/vinilos/ArtistPrizeBackendRealTest.kt'
      - 'app/src/main/java/co/edu/uniandes/vinilos/data/ArtistPrize*'
      - 'app/src/main/java/co/edu/uniandes/vinilos/model/Prize.kt'
permissions:
  contents: read
jobs:
  artist-prizes-real:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: vinyls
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TheSoftwareDesignLab/BackVynils
          ref: 7178f83662022904dc9e88b8a2292568954b56cf
          path: backend-test
      - name: Construir y levantar BackVynils aislado
        run: |
          docker build -t vinilos-backend-test backend-test
          docker run -d --name vinilos-backend-test --network host -e DB_HOST=127.0.0.1 -e DB_USER=postgres -e DB_PASS=postgres -e DB_NAME=vinyls -e USE_SSL=false vinilos-backend-test
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/albums > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs vinilos-backend-test
          exit 1
      - name: Cargar datos solo en la base efímera del runner
        env:
          PGPASSWORD: postgres
        run: |
          python3 -c "from pathlib import Path; print(Path('backend-test/sql/data.sql').read_text(encoding='utf-8-sig'))" > /tmp/vinilos-test-data.sql
          psql -h localhost -U postgres -d vinyls -v ON_ERROR_STOP=1 -f /tmp/vinilos-test-data.sql
          curl --fail http://localhost:3000/albums
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Contrato HU14 contra BackVynils
        env:
          BACKVYNILS_URL: http://localhost:3000/
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'co.edu.uniandes.vinilos.ArtistPrizeBackendRealTest' --rerun
      - name: Conservar log del backend
        if: always()
        run: docker logs vinilos-backend-test > backend-test.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hu14-backend-real
          path: |
            app/build/reports/tests/
            app/build/test-results/testDebugUnitTest/TEST-co.edu.uniandes.vinilos.ArtistPrizeBackendRealTest.xml
            backend-test.log
