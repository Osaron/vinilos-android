name: Portada HTTPS real
on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/cover-https-real.yml'
      - 'app/src/main/java/co/edu/uniandes/vinilos/data/LegacyImageTls.kt'
      - 'app/src/main/java/co/edu/uniandes/vinilos/VinilosApplication.kt'
      - 'app/src/main/res/raw/isrg_root_x1.pem'
      - 'app/src/androidTest/java/co/edu/uniandes/vinilos/WikimediaCoverRealTest.kt'
permissions:
  contents: read
jobs:
  cover-real:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 21
            target: default
          - api: 34
            target: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -dns-server 8.8.8.8,8.8.4.4
          script: ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.coverReal=true -Pandroid.testInstrumentationRunnerArguments.class=co.edu.uniandes.vinilos.WikimediaCoverRealTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portada-real-api-${{ matrix.api }}
          path: app/build/reports/androidTests/
